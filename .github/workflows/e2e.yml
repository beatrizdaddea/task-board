name: Frontend E2E

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings_e2e
      E2E_DJANGO_SETTINGS: config.settings_e2e
      DJANGO_SECRET_KEY: e2e-ci-only-secret-key-change-this-at-least-50-characters
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      HEADLESS: "true"
      E2E_ACTION_DELAY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py reset_e2e_data
      - name: Start backend
        run: python backend/manage.py runserver 127.0.0.1:8000 > /tmp/taskboard-backend.log 2>&1 &
      - name: Start frontend
        run: npm run dev -- --host 127.0.0.1 > /tmp/taskboard-frontend.log 2>&1 &
        working-directory: frontend
      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:8000/ && curl --fail --silent http://127.0.0.1:5173/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taskboard-backend.log
          cat /tmp/taskboard-frontend.log
          exit 1
      - run: npm run e2e:typecheck
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Show application logs on failure
        if: failure()
        run: |
          cat /tmp/taskboard-backend.log || true
          cat /tmp/taskboard-frontend.log || true
